<!doctype html>
<html lang="id" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agenda Pimpinan - Setda Kabupaten Bungo</title>

  <script src="/_sdk/element_sdk.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <style>
    body { box-sizing: border-box; }
    .status-badge{display:inline-block;padding:.25rem .75rem;border-radius:9999px;font-size:.75rem;font-weight:600}
    .status-terjadwal{background-color:#DBEAFE;color:#1E40AF}
    .status-berlangsung{background-color:#D1FAE5;color:#065F46}
    .status-selesai{background-color:#E5E7EB;color:#374151}
    .agenda-card{transition:all .2s ease}
    .agenda-card:hover{transform:translateY(-2px);box-shadow:0 10px 25px -5px rgba(0,0,0,.1)}
    .modal-backdrop{background-color:rgba(0,0,0,.5)}
    .loading-spinner{border:3px solid #f3f4f6;border-top:3px solid #2563EB;border-radius:50%;width:24px;height:24px;animation:spin 1s linear infinite}
    @keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
    .toast{position:fixed;bottom:20px;right:20px;padding:1rem 1.5rem;border-radius:.5rem;box-shadow:0 10px 25px -5px rgba(0,0,0,.2);z-index:1000;animation:slideIn .3s ease}
    @keyframes slideIn{from{transform:translateX(400px);opacity:0}to{transform:translateX(0);opacity:1}}
    .toast-success{background-color:#10B981;color:white}
    .toast-error{background-color:#EF4444;color:white}
    .modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;z-index:999}
    .modal.active{display:flex;align-items:center;justify-content:center}
  </style>
</head>

<body class="h-full">
  <div id="app-wrapper" class="h-full w-full overflow-auto">
    <div class="min-h-full" style="background: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.6)), url('https://i.imgur.com/vmW96k6.png') center/cover no-repeat fixed;">

      <!-- Header -->
      <header class="px-6 py-8">
        <div class="max-w-7xl mx-auto">
          <div class="flex justify-between items-start">
            <div>
              <h1 id="judul-halaman" class="text-4xl font-bold text-white mb-2">Agenda Kegiatan Pimpinan</h1>
              <p id="nama-instansi" class="text-xl text-white opacity-90">Sekretariat Daerah Kabupaten Bungo</p>
            </div>
            <div class="flex gap-2 items-center flex-wrap">
              <div id="admin-status" class="hidden px-4 py-2 bg-white bg-opacity-20 rounded-lg text-white font-semibold">
                👤 Admin
              </div>
              <button id="btn-laporan" class="hidden px-4 py-2 bg-green-500 hover:bg-green-600 rounded-lg text-white font-semibold transition-all">
                📊 Laporan
              </button>
              <button id="btn-admin-toggle" class="px-4 py-2 bg-white bg-opacity-20 hover:bg-opacity-30 rounded-lg text-white font-semibold transition-all">
                🔐 Login Admin
              </button>
            </div>
          </div>
        </div>
      </header>

      <!-- Main -->
      <main class="px-6 pb-12">
        <div class="max-w-7xl mx-auto">
          <div class="mb-6 flex flex-wrap gap-3 justify-between items-center">
            <div class="flex gap-3 flex-wrap">
              <select id="filter-status" class="px-4 py-2 rounded-lg bg-white border-2 border-transparent focus:border-purple-300 focus:outline-none">
                <option value="semua">Semua Status</option>
                <option value="terjadwal">Terjadwal</option>
                <option value="berlangsung">Berlangsung</option>
                <option value="selesai">Selesai</option>
              </select>
              <input type="date" id="filter-tanggal" class="px-4 py-2 rounded-lg bg-white border-2 border-transparent focus:border-purple-300 focus:outline-none">
            </div>
            <button id="btn-tambah-agenda" class="hidden px-6 py-2 bg-white text-purple-700 font-semibold rounded-lg hover:bg-opacity-90 transition-all shadow-lg">
              ➕ Tambah Agenda
            </button>
          </div>

          <div id="agenda-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>

          <div id="empty-state" class="text-center py-16 text-white">
            <div class="text-6xl mb-4">📅</div>
            <h3 class="text-2xl font-bold mb-2">Belum Ada Agenda</h3>
            <p class="text-lg opacity-80">Jika kosong, login admin untuk menambahkan agenda.</p>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Modal Form Agenda -->
  <div id="modal-form" class="modal">
    <div class="modal-backdrop" onclick="closeModal()"></div>
    <div class="bg-white rounded-xl shadow-2xl max-w-2xl w-full mx-4 max-h-[90vh] overflow-y-auto relative z-10">
      <div class="sticky top-0 bg-gradient-to-r from-purple-600 to-purple-700 px-6 py-4 flex justify-between items-center rounded-t-xl">
        <h2 id="modal-title" class="text-2xl font-bold text-white">Tambah Agenda Baru</h2>
        <button onclick="closeModal()" class="text-white hover:bg-white hover:bg-opacity-20 rounded-full p-2 transition-all"> ✕ </button>
      </div>
      <form id="form-agenda" class="p-6 space-y-4">
        <div>
          <label class="block text-gray-700 font-semibold mb-2">Judul Agenda *</label>
          <input type="text" id="input-judul" required class="w-full px-4 py-2 border-2 border-gray-300 rounded-lg focus:border-purple-500 focus:outline-none">
        </div>
        <div>
          <label class="block text-gray-700 font-semibold mb-2">Nama Pejabat/Pimpinan *</label>
          <input type="text" id="input-pejabat" required class="w-full px-4 py-2 border-2 border-gray-300 rounded-lg focus:border-purple-500 focus:outline-none">
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-gray-700 font-semibold mb-2">Tanggal *</label>
            <input type="date" id="input-tanggal" required class="w-full px-4 py-2 border-2 border-gray-300 rounded-lg focus:border-purple-500 focus:outline-none">
          </div>
          <div>
            <label class="block text-gray-700 font-semibold mb-2">Status *</label>
            <select id="input-status" required class="w-full px-4 py-2 border-2 border-gray-300 rounded-lg focus:border-purple-500 focus:outline-none">
              <option value="terjadwal">Terjadwal</option>
              <option value="berlangsung">Berlangsung</option>
              <option value="selesai">Selesai</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-gray-700 font-semibold mb-2">Waktu Mulai *</label>
            <input type="time" id="input-waktu-mulai" required class="w-full px-4 py-2 border-2 border-gray-300 rounded-lg focus:border-purple-500 focus:outline-none">
          </div>
          <div>
            <label class="block text-gray-700 font-semibold mb-2">Waktu Selesai *</label>
            <input type="time" id="input-waktu-selesai" required class="w-full px-4 py-2 border-2 border-gray-300 rounded-lg focus:border-purple-500 focus:outline-none">
          </div>
        </div>

        <div>
          <label class="block text-gray-700 font-semibold mb-2">Lokasi *</label>
          <input type="text" id="input-lokasi" required class="w-full px-4 py-2 border-2 border-gray-300 rounded-lg focus:border-purple-500 focus:outline-none">
        </div>

        <div>
          <label class="block text-gray-700 font-semibold mb-2">Deskripsi</label>
          <textarea id="input-deskripsi" rows="4" class="w-full px-4 py-2 border-2 border-gray-300 rounded-lg focus:border-purple-500 focus:outline-none"></textarea>
        </div>

        <div class="flex gap-3 pt-4">
          <button type="submit" id="btn-submit" class="flex-1 bg-purple-600 text-white font-semibold py-3 rounded-lg hover:bg-purple-700 transition-all flex items-center justify-center gap-2">
            <span>Simpan Agenda</span>
          </button>
          <button type="button" onclick="closeModal()" class="px-6 bg-gray-200 text-gray-700 font-semibold py-3 rounded-lg hover:bg-gray-300 transition-all">
            Batal
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal Detail Agenda -->
  <div id="modal-detail" class="modal">
    <div class="modal-backdrop" onclick="closeDetailModal()"></div>
    <div class="bg-white rounded-xl shadow-2xl max-w-2xl w-full mx-4 max-h-[90vh] overflow-y-auto relative z-10">
      <div class="sticky top-0 bg-gradient-to-r from-purple-600 to-purple-700 px-6 py-4 flex justify-between items-center rounded-t-xl">
        <h2 class="text-2xl font-bold text-white">Detail Agenda</h2>
        <button onclick="closeDetailModal()" class="text-white hover:bg-white hover:bg-opacity-20 rounded-full p-2 transition-all"> ✕ </button>
      </div>
      <div id="detail-content" class="p-6"></div>
    </div>
  </div>

  <!-- Modal Login Admin -->
  <div id="modal-login" class="modal">
    <div class="modal-backdrop" onclick="closeLoginModal()"></div>
    <div class="bg-white rounded-xl shadow-2xl max-w-md w-full mx-4 relative z-10">
      <div class="bg-gradient-to-r from-purple-600 to-purple-700 px-6 py-4 flex justify-between items-center rounded-t-xl">
        <h2 class="text-2xl font-bold text-white">🔐 Login Admin</h2>
        <button onclick="closeLoginModal()" class="text-white hover:bg-white hover:bg-opacity-20 rounded-full p-2 transition-all"> ✕ </button>
      </div>
      <form id="form-login" class="p-6 space-y-4">
        <div>
          <label class="block text-gray-700 font-semibold mb-2">Password</label>
          <input type="password" id="input-password" required class="w-full px-4 py-2 border-2 border-gray-300 rounded-lg focus:border-purple-500 focus:outline-none" placeholder="Masukkan password admin">
          <p id="error-message" class="hidden text-red-500 text-sm mt-2">❌ Password salah!</p>
        </div>
        <button type="submit" class="w-full bg-purple-600 text-white font-semibold py-3 rounded-lg hover:bg-purple-700 transition-all">
          Masuk
        </button>
      </form>
    </div>
  </div>

  <!-- Modal Laporan -->
  <div id="modal-laporan" class="modal">
    <div class="modal-backdrop" onclick="closeLaporanModal()"></div>
    <div class="bg-white rounded-xl shadow-2xl max-w-4xl w-full mx-4 max-h-[90vh] overflow-y-auto relative z-10">
      <div class="sticky top-0 bg-gradient-to-r from-green-600 to-green-700 px-6 py-4 flex justify-between items-center rounded-t-xl">
        <h2 class="text-2xl font-bold text-white">📊 Laporan Agenda</h2>
        <button onclick="closeLaporanModal()" class="text-white hover:bg-white hover:bg-opacity-20 rounded-full p-2 transition-all"> ✕ </button>
      </div>

      <div class="p-6 space-y-6">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div>
            <label class="block text-gray-700 font-semibold mb-2">Jenis Laporan</label>
            <select id="jenis-laporan" class="w-full px-4 py-2 border-2 border-gray-300 rounded-lg focus:border-green-500 focus:outline-none">
              <option value="bulanan">Laporan Bulanan</option>
              <option value="tahunan">Laporan Tahunan</option>
            </select>
          </div>
          <div id="bulan-container">
            <label class="block text-gray-700 font-semibold mb-2">Bulan</label>
            <select id="bulan-laporan" class="w-full px-4 py-2 border-2 border-gray-300 rounded-lg focus:border-green-500 focus:outline-none">
              <option value="01">Januari</option>
              <option value="02">Februari</option>
              <option value="03">Maret</option>
              <option value="04">April</option>
              <option value="05">Mei</option>
              <option value="06">Juni</option>
              <option value="07">Juli</option>
              <option value="08">Agustus</option>
              <option value="09">September</option>
              <option value="10">Oktober</option>
              <option value="11">November</option>
              <option value="12">Desember</option>
            </select>
          </div>
          <div>
            <label class="block text-gray-700 font-semibold mb-2">Tahun</label>
            <select id="tahun-laporan" class="w-full px-4 py-2 border-2 border-gray-300 rounded-lg focus:border-green-500 focus:outline-none"></select>
          </div>
        </div>

        <div class="flex gap-3">
          <button id="btn-generate-laporan" class="flex-1 bg-green-600 text-white font-semibold py-3 rounded-lg hover:bg-green-700 transition-all">🔄 Tampilkan Laporan</button>
          <button id="btn-print-direct" class="flex-1 bg-purple-600 text-white font-semibold py-3 rounded-lg hover:bg-purple-700 transition-all">🖨️ Cetak Langsung</button>
          <button id="btn-print-pdf" class="flex-1 bg-blue-600 text-white font-semibold py-3 rounded-lg hover:bg-blue-700 transition-all">📄 Download PDF</button>
        </div>

        <div id="laporan-preview" class="hidden">
          <div class="border-2 border-gray-300 rounded-lg p-6 bg-white" id="laporan-content"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const defaultConfig = {
      judul_halaman: "Agenda Kegiatan Pimpinan",
      nama_instansi: "Sekretariat Daerah Kabupaten Bungo"
    };

    // TODO: ganti dengan URL Web App Google Apps Script Anda.
    // Bentuknya: https://script.google.com/macros/s/DEPLOYMENT_ID/exec
    const GAS_URL = "https://script.google.com/macros/s/AKfycbxz6pu1BQXW1Bc8WgO2mLurGer0Jbt-ahAuzIgH-0IQHCm-qBQQgnxLo2XYHexOt7cQSA/exec";


    let allAgendas = [];
    let isAdmin = false;
    let editingAgenda = null;
    let adminToken = null;

    const googleSheetService = {
      _getUrl() { return GAS_URL; },

      async request(action, params = {}) {
        const url = this._getUrl();
        const fullUrl = `${url}?action=${encodeURIComponent(action)}`;

        const body = params && Object.keys(params).length ? JSON.stringify(params) : '';
        const headers = { 'Content-Type': 'application/json' };

        const resp = await fetch(fullUrl, {
          method: 'POST',
          headers,
          body
        });
        const data = await resp.json();
        if (!resp.ok || data.error) throw new Error(data.error || 'Request gagal');
        return data;
      },

      async getAll() {
        try {
          const data = await this.request('read');
          return Array.isArray(data) ? data : (data.agendas || []);
        } catch (e) {
          console.error(e);
          showToast('Gagal mengambil data', 'error');
          return [];
        }
      },

      async create(agenda) {
        try {
          const payload = { agenda, auth: adminToken };
          const data = await this.request('create', payload);
          return data;
        } catch (e) {
          return { isOk: false, error: e.message };
        }
      },

      async update(agenda) {
        try {
          const payload = { agenda, auth: adminToken };
          const data = await this.request('update', payload);
          return data;
        } catch (e) {
          return { isOk: false, error: e.message };
        }
      },

      async deleteById(id) {
        try {
          const payload = { id, auth: adminToken };
          const data = await this.request('delete', payload);
          return data;
        } catch (e) {
          return { isOk: false, error: e.message };
        }
      },

      async login(password) {
        try {
          const data = await this.request('login', { password });
          // expected: {isOk:true, token: '...'}
          if (data && data.isOk) return { isOk: true, token: data.token };
          return { isOk: false, error: data.error || 'Login gagal' };
        } catch (e) {
          return { isOk: false, error: e.message };
        }
      },

      async logout() {
        try {
          await this.request('logout', { auth: adminToken });
          return { isOk: true };
        } catch (e) {
          return { isOk: false, error: e.message };
        } finally {
          adminToken = null;
        }
      }
    };

    async function initializeApp() {
      if (window.elementSdk) {
        window.elementSdk.init({
          defaultConfig,
          onConfigChange: async (config) => {
            const judulElement = document.getElementById('judul-halaman');
            const instansiElement = document.getElementById('nama-instansi');
            if (judulElement) judulElement.textContent = config.judul_halaman || defaultConfig.judul_halaman;
            if (instansiElement) instansiElement.textContent = config.nama_instansi || defaultConfig.nama_instansi;
          }
        });
      }

      await refreshData();
      setInterval(refreshData, 30000);

      // Coba restore token (jika Anda ingin sesi persisten)
      try {
        const saved = localStorage.getItem('agenda_admin_token');
        if (saved) {
          adminToken = saved;
          // tidak semua implementasi butuh validasi token di sini.
          // Admin buttons tetap menunggu login sukses/izin server.
          isAdmin = true;
          updateAdminUI();
        }
      } catch (_) {}
    }

    function updateAdminUI() {
      const btnToggle = document.getElementById('btn-admin-toggle');
      const adminStatus = document.getElementById('admin-status');
      const btnTambah = document.getElementById('btn-tambah-agenda');
      const btnLaporan = document.getElementById('btn-laporan');

      if (isAdmin) {
        btnToggle.textContent = '🚪 Logout Admin';
        btnToggle.classList.remove('bg-white','bg-opacity-20');
        btnToggle.classList.add('bg-red-500');
        adminStatus.classList.remove('hidden');
        btnTambah.classList.remove('hidden');
        btnLaporan.classList.remove('hidden');
      } else {
        btnToggle.textContent = '🔐 Login Admin';
        btnToggle.classList.add('bg-white','bg-opacity-20');
        btnToggle.classList.remove('bg-red-500');
        adminStatus.classList.add('hidden');
        btnTambah.classList.add('hidden');
        btnLaporan.classList.add('hidden');
      }
    }

    async function refreshData() {
      if (!GAS_URL || GAS_URL.includes('ISI_URL')) return;
      const data = await googleSheetService.getAll();
      allAgendas = data || [];
      await checkAndUpdateExpiredAgendas();
      renderAgendas();
    }

    async function checkAndUpdateExpiredAgendas() {
      // Otomatis update status berdasarkan jam.
      // Agar tidak boros update, update hanya jika perlu.
      const now = new Date();
      const today = new Date();
      today.setHours(0,0,0,0);

      const updates = [];

      for (const agenda of allAgendas) {
        const agendaDate = new Date(agenda.tanggal);
        agendaDate.setHours(0,0,0,0);

        const [jamMulai, menitMulai] = (agenda.waktu_mulai || '').split(':').map(Number);
        const [jamSelesai, menitSelesai] = (agenda.waktu_selesai || '').split(':').map(Number);
        if (Number.isNaN(jamMulai) || Number.isNaN(jamSelesai)) continue;

        const waktuMulai = new Date(agenda.tanggal);
        waktuMulai.setHours(jamMulai, menitMulai, 0, 0);

        const waktuSelesai = new Date(agenda.tanggal);
        waktuSelesai.setHours(jamSelesai, menitSelesai, 0, 0);

        let newStatus = agenda.status;
        if (agendaDate.getTime() === today.getTime() && now >= waktuMulai && now <= waktuSelesai) {
          if (agenda.status !== 'berlangsung') newStatus = 'berlangsung';
        } else if (agendaDate < today || (agendaDate.getTime() === today.getTime() && now > waktuSelesai)) {
          if (agenda.status !== 'selesai') newStatus = 'selesai';
        }

        if (newStatus !== agenda.status) {
          updates.push({ ...agenda, status: newStatus });
        }
      }

      if (updates.length === 0) return;

      // Jika bukan admin, update otomatis akan gagal kecuali endpoint izinkan.
      // Di GAS kita izinkan update status tanpa auth (opsional). Untuk aman, kita tetap coba.
      for (const u of updates) {
        await googleSheetService.update(u);
      }
    }

    function toggleAdminAccess() {
      if (isAdmin) {
        doLogout();
      } else {
        document.getElementById('modal-login').classList.add('active');
        document.getElementById('input-password').value = '';
        document.getElementById('error-message').classList.add('hidden');
      }
    }

    async function doLogout() {
      await googleSheetService.logout();
      isAdmin = false;
      adminToken = null;
      try { localStorage.removeItem('agenda_admin_token'); } catch (_) {}
      updateAdminUI();
      showToast('Logout berhasil', 'success');
      renderAgendas();
    }

    async function doLogin(password) {
      const res = await googleSheetService.login(password);
      if (res && res.isOk && res.token) {
        adminToken = res.token;
        isAdmin = true;
        try { localStorage.setItem('agenda_admin_token', adminToken); } catch (_) {}
        updateAdminUI();
        closeLoginModal();
        showToast('Login berhasil', 'success');
        renderAgendas();
        document.getElementById('btn-tambah-agenda')?.focus?.();
        return true;
      }
      document.getElementById('error-message').classList.remove('hidden');
      return false;
    }

    function closeLoginModal() {
      document.getElementById('modal-login').classList.remove('active');
      document.getElementById('input-password').value = '';
      document.getElementById('error-message').classList.add('hidden');
    }

    function renderAgendas() {
      const container = document.getElementById('agenda-container');
      const emptyState = document.getElementById('empty-state');
      const filterStatus = document.getElementById('filter-status').value;
      const filterTanggal = document.getElementById('filter-tanggal').value;

      let filtered = allAgendas.slice();
      if (filterStatus !== 'semua') filtered = filtered.filter(a => a.status === filterStatus);
      if (filterTanggal) filtered = filtered.filter(a => a.tanggal === filterTanggal);

      filtered.sort((a,b) => new Date(b.tanggal) - new Date(a.tanggal));

      if (filtered.length === 0) {
        container.innerHTML = '';
        emptyState.classList.remove('hidden');
        return;
      }
      emptyState.classList.add('hidden');

      container.innerHTML = filtered.map(agenda => `
        <div class="agenda-card bg-white rounded-xl shadow-lg p-6 cursor-pointer" onclick="showDetail('${agenda.id}')">
          <div class="flex justify-between items-start mb-4">
            <div class="flex-1">
              <h3 class="text-xl font-bold text-gray-800 mb-1">${escapeHtml(agenda.judul)}</h3>
              <p class="text-purple-600 font-semibold">👤 ${escapeHtml(agenda.pejabat || '')}</p>
            </div>
            <span class="status-badge status-${agenda.status}">${getStatusLabel(agenda.status)}</span>
          </div>
          <div class="space-y-2 text-gray-600">
            <div class="flex items-center gap-2"><span>📅</span><span>${formatTanggal(agenda.tanggal)}</span></div>
            <div class="flex items-center gap-2"><span>🕐</span><span>${escapeHtml(agenda.waktu_mulai)} - ${escapeHtml(agenda.waktu_selesai)}</span></div>
            <div class="flex items-center gap-2"><span>📍</span><span>${escapeHtml(agenda.lokasi)}</span></div>
          </div>

          ${isAdmin ? `
            <div class="flex gap-2 mt-4 pt-4 border-t border-gray-200">
              <button onclick="event.stopPropagation(); editAgenda('${agenda.id}')" class="flex-1 bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600 transition-all font-semibold">✏️ Edit</button>
              <button onclick="event.stopPropagation(); deleteAgenda('${agenda.id}', this)" class="flex-1 bg-red-500 text-white px-4 py-2 rounded-lg hover:bg-red-600 transition-all font-semibold">🗑️ Hapus</button>
            </div>
          ` : ''}
        </div>
      `).join('');
    }

    function showDetail(id) {
      const agenda = allAgendas.find(a => String(a.id) === String(id));
      if (!agenda) return;

      const content = document.getElementById('detail-content');
      content.innerHTML = `
        <div class="space-y-4">
          <div>
            <h3 class="text-2xl font-bold text-gray-800 mb-2">${escapeHtml(agenda.judul)}</h3>
            <span class="status-badge status-${agenda.status}">${getStatusLabel(agenda.status)}</span>
          </div>

          <div class="border-t border-gray-200 pt-4 space-y-3">
            <div class="flex items-start gap-3">
              <span class="text-2xl">👤</span>
              <div>
                <p class="font-semibold text-gray-700">Pejabat/Pimpinan</p>
                <p class="text-gray-600">${escapeHtml(agenda.pejabat || '')}</p>
              </div>
            </div>
            <div class="flex items-start gap-3">
              <span class="text-2xl">📅</span>
              <div>
                <p class="font-semibold text-gray-700">Tanggal</p>
                <p class="text-gray-600">${formatTanggal(agenda.tanggal)}</p>
              </div>
            </div>
            <div class="flex items-start gap-3">
              <span class="text-2xl">🕐</span>
              <div>
                <p class="font-semibold text-gray-700">Waktu</p>
                <p class="text-gray-600">${escapeHtml(agenda.waktu_mulai)} - ${escapeHtml(agenda.waktu_selesai)}</p>
              </div>
            </div>
            <div class="flex items-start gap-3">
              <span class="text-2xl">📍</span>
              <div>
                <p class="font-semibold text-gray-700">Lokasi</p>
                <p class="text-gray-600">${escapeHtml(agenda.lokasi || '')}</p>
              </div>
            </div>
            ${agenda.deskripsi ? `
              <div class="flex items-start gap-3">
                <span class="text-2xl">📝</span>
                <div>
                  <p class="font-semibold text-gray-700">Deskripsi</p>
                  <p class="text-gray-600">${escapeHtml(agenda.deskripsi)}</p>
                </div>
              </div>
            ` : ''}
          </div>
        </div>
      `;

      document.getElementById('modal-detail').classList.add('active');
    }

    function closeDetailModal() {
      document.getElementById('modal-detail').classList.remove('active');
    }

    function openFormModal() {
      editingAgenda = null;
      document.getElementById('modal-title').textContent = 'Tambah Agenda Baru';
      document.getElementById('form-agenda').reset();
      document.getElementById('modal-form').classList.add('active');
    }

    function closeModal() {
      document.getElementById('modal-form').classList.remove('active');
      editingAgenda = null;
    }

    function editAgenda(id) {
      const agenda = allAgendas.find(a => String(a.id) === String(id));
      if (!agenda) return;

      editingAgenda = agenda;
      document.getElementById('modal-title').textContent = 'Edit Agenda';
      document.getElementById('input-judul').value = agenda.judul || '';
      document.getElementById('input-pejabat').value = agenda.pejabat || '';
      document.getElementById('input-tanggal').value = agenda.tanggal || '';
      document.getElementById('input-status').value = agenda.status || 'terjadwal';
      document.getElementById('input-waktu-mulai').value = agenda.waktu_mulai || '';
      document.getElementById('input-waktu-selesai').value = agenda.waktu_selesai || '';
      document.getElementById('input-lokasi').value = agenda.lokasi || '';
      document.getElementById('input-deskripsi').value = agenda.deskripsi || '';
      document.getElementById('modal-form').classList.add('active');
    }

    async function deleteAgenda(id, btn) {
      if (!btn) return;

      if (btn.dataset.confirming === 'true') {
        btn.disabled = true;
        const original = btn.innerHTML;
        btn.innerHTML = '<div class="loading-spinner mx-auto"></div>';

        const result = await googleSheetService.deleteById(id);
        if (result && result.isOk) {
          showToast('Agenda berhasil dihapus', 'success');
          await refreshData();
        } else {
          showToast('Gagal menghapus: ' + (result?.error || ''), 'error');
          btn.disabled = false;
          btn.innerHTML = original;
          btn.dataset.confirming = 'false';
        }
        return;
      }

      btn.textContent = 'Konfirmasi Hapus?';
      btn.dataset.confirming = 'true';
      setTimeout(() => {
        if (btn.dataset.confirming === 'true') {
          btn.textContent = '🗑️ Hapus';
          btn.dataset.confirming = 'false';
        }
      }, 3000);
    }

    document.getElementById('form-agenda').addEventListener('submit', async (e) => {
      e.preventDefault();

      const btnSubmit = document.getElementById('btn-submit');
      const originalContent = btnSubmit.innerHTML;
      btnSubmit.disabled = true;
      btnSubmit.innerHTML = '<div class="loading-spinner mx-auto"></div>';

      const payloadAgenda = {
        id: editingAgenda ? editingAgenda.id : undefined,
        judul: document.getElementById('input-judul').value,
        pejabat: document.getElementById('input-pejabat').value,
        tanggal: document.getElementById('input-tanggal').value,
        status: document.getElementById('input-status').value,
        waktu_mulai: document.getElementById('input-waktu-mulai').value,
        waktu_selesai: document.getElementById('input-waktu-selesai').value,
        lokasi: document.getElementById('input-lokasi').value,
        deskripsi: document.getElementById('input-deskripsi').value,
      };

      let result;
      if (editingAgenda) {
        result = await googleSheetService.update(payloadAgenda);
      } else {
        result = await googleSheetService.create(payloadAgenda);
      }

      if (result && result.isOk) {
        showToast(editingAgenda ? 'Agenda berhasil diperbarui' : 'Agenda berhasil ditambahkan', 'success');
        closeModal();
        await refreshData();
      } else {
        showToast('Gagal menyimpan agenda: ' + (result?.error || ''), 'error');
      }

      btnSubmit.disabled = false;
      btnSubmit.innerHTML = originalContent;
    });

    // Laporan
    function openLaporanModal() {
      document.getElementById('modal-laporan').classList.add('active');
      populateTahunOptions();
      setDefaultLaporanDates();
    }

    function closeLaporanModal() {
      document.getElementById('modal-laporan').classList.remove('active');
      document.getElementById('laporan-preview').classList.add('hidden');
    }

    function populateTahunOptions() {
      const tahunSelect = document.getElementById('tahun-laporan');
      const currentYear = new Date().getFullYear();
      tahunSelect.innerHTML = '';
      for (let year = currentYear; year >= currentYear - 5; year--) {
        const option = document.createElement('option');
        option.value = String(year);
        option.textContent = String(year);
        tahunSelect.appendChild(option);
      }
    }

    function setDefaultLaporanDates() {
      const now = new Date();
      const bulanSelect = document.getElementById('bulan-laporan');
      bulanSelect.value = String(now.getMonth() + 1).padStart(2, '0');
    }

    document.getElementById('jenis-laporan').addEventListener('change', (e) => {
      const bulanContainer = document.getElementById('bulan-container');
      if (e.target.value === 'tahunan') bulanContainer.classList.add('hidden');
      else bulanContainer.classList.remove('hidden');
    });

    document.getElementById('btn-generate-laporan').addEventListener('click', generateLaporan);
    document.getElementById('btn-print-direct').addEventListener('click', printDirect);
    document.getElementById('btn-print-pdf').addEventListener('click', printPDF);

    function generateLaporan() {
      const jenis = document.getElementById('jenis-laporan').value;
      const bulan = document.getElementById('bulan-laporan').value;
      const tahun = document.getElementById('tahun-laporan').value;

      let filtered = allAgendas.slice();
      if (jenis === 'bulanan') {
        filtered = allAgendas.filter(agenda => {
          const d = new Date(agenda.tanggal);
          return d.getMonth() + 1 === parseInt(bulan,10) && d.getFullYear() === parseInt(tahun,10);
        });
      } else {
        filtered = allAgendas.filter(agenda => {
          const d = new Date(agenda.tanggal);
          return d.getFullYear() === parseInt(tahun,10);
        });
      }

      renderLaporan(filtered, jenis, bulan, tahun);
    }

    function renderLaporan(data, jenis, bulan, tahun) {
      const preview = document.getElementById('laporan-preview');
      const content = document.getElementById('laporan-content');
      const namaBulan = ['', 'Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
      const judulPeriode = jenis === 'bulanan' ? `${namaBulan[parseInt(bulan,10)]} ${tahun}` : `Tahun ${tahun}`;

      const total = data.length;
      const terjadwal = data.filter(a => a.status === 'terjadwal').length;
      const berlangsung = data.filter(a => a.status === 'berlangsung').length;
      const selesai = data.filter(a => a.status === 'selesai').length;

      content.innerHTML = `
        <div class="text-center mb-6">
          <h3 class="text-2xl font-bold text-gray-800 mb-1">LAPORAN AGENDA KEGIATAN PIMPINAN</h3>
          <p class="text-lg font-semibold text-purple-600 mt-2">${escapeHtml(judulPeriode)}</p>
        </div>

        <div class="grid grid-cols-4 gap-4 mb-6">
          <div class="bg-blue-50 p-4 rounded-lg text-center">
            <p class="text-sm text-gray-600 mb-1">Total Agenda</p>
            <p class="text-3xl font-bold text-blue-600">${total}</p>
          </div>
          <div class="bg-yellow-50 p-4 rounded-lg text-center">
            <p class="text-sm text-gray-600 mb-1">Terjadwal</p>
            <p class="text-3xl font-bold text-yellow-600">${terjadwal}</p>
          </div>
          <div class="bg-green-50 p-4 rounded-lg text-center">
            <p class="text-sm text-gray-600 mb-1">Berlangsung</p>
            <p class="text-3xl font-bold text-green-600">${berlangsung}</p>
          </div>
          <div class="bg-gray-50 p-4 rounded-lg text-center">
            <p class="text-sm text-gray-600 mb-1">Selesai</p>
            <p class="text-3xl font-bold text-gray-600">${selesai}</p>
          </div>
        </div>

        <div class="overflow-x-auto">
          <table class="w-full border-collapse text-sm">
            <thead>
              <tr class="bg-purple-600 text-white">
                <th class="border border-gray-300 px-4 py-2 text-left">No</th>
                <th class="border border-gray-300 px-4 py-2 text-left">Tanggal</th>
                <th class="border border-gray-300 px-4 py-2 text-left">Judul Agenda</th>
                <th class="border border-gray-300 px-4 py-2 text-left">Pejabat</th>
                <th class="border border-gray-300 px-4 py-2 text-left">Waktu</th>
                <th class="border border-gray-300 px-4 py-2 text-left">Lokasi</th>
                <th class="border border-gray-300 px-4 py-2 text-left">Status</th>
              </tr>
            </thead>
            <tbody>
              ${data.length ? data.map((agenda, i) => `
                <tr>
                  <td class="border border-gray-300 px-4 py-2">${i+1}</td>
                  <td class="border border-gray-300 px-4 py-2">${escapeHtml(formatTanggalSingkat(agenda.tanggal))}</td>
                  <td class="border border-gray-300 px-4 py-2">${escapeHtml(agenda.judul)}</td>
                  <td class="border border-gray-300 px-4 py-2">${escapeHtml(agenda.pejabat || '')}</td>
                  <td class="border border-gray-300 px-4 py-2">${escapeHtml(agenda.waktu_mulai)}-${escapeHtml(agenda.waktu_selesai)}</td>
                  <td class="border border-gray-300 px-4 py-2">${escapeHtml(agenda.lokasi || '')}</td>
                  <td class="border border-gray-300 px-4 py-2">${escapeHtml(getStatusLabel(agenda.status))}</td>
                </tr>
              `).join('') : `
                <tr>
                  <td colspan="7" class="border border-gray-300 px-4 py-8 text-center text-gray-500">Tidak ada data untuk periode ini</td>
                </tr>
              `}
            </tbody>
          </table>
        </div>

        <div class="mt-6 text-right">
          <p class="text-sm text-gray-600">Dicetak pada: ${escapeHtml(new Date().toLocaleDateString('id-ID'))}</p>
        </div>
      `;

      preview.classList.remove('hidden');
    }

    async function printDirect() {
      const preview = document.getElementById('laporan-preview');
      if (preview.classList.contains('hidden')) {
        showToast('Silakan generate laporan terlebih dahulu', 'error');
        return;
      }

      const btnPrint = document.getElementById('btn-print-direct');
      const originalContent = btnPrint.innerHTML;
      btnPrint.disabled = true;
      btnPrint.innerHTML = '<div class="loading-spinner mx-auto"></div>';

      try {
        const content = document.getElementById('laporan-content');
        const printWindow = window.open('', '_blank');
        if (!printWindow) throw new Error('Pop-up diblokir. Izinkan pop-up untuk mencetak.');

        printWindow.document.write(`
          <!DOCTYPE html>
          <html><head><title>Cetak Laporan Agenda</title>
          <style>
            *{margin:0;padding:0;box-sizing:border-box}
            body{font-family:Arial,sans-serif;padding:20mm;background:white}
            table{width:100%;border-collapse:collapse;margin-top:1rem}
            th,td{border:1px solid #d1d5db;padding:0.5rem 1rem;text-align:left}
            th{background-color:#9333ea;color:white;font-weight:600}
            @media print{body{padding:10mm}@page{margin:10mm}}
          </style></head>
          <body>${content.innerHTML}</body>
          </html>
        `);
        printWindow.document.close();

        setTimeout(() => {
          printWindow.focus();
          printWindow.print();
          printWindow.onafterprint = () => printWindow.close();
        }, 500);

        showToast('✅ Mengirim ke printer...', 'success');
      } catch (error) {
        console.error(error);
        showToast('❌ Gagal mencetak: ' + error.message, 'error');
      } finally {
        btnPrint.disabled = false;
        btnPrint.innerHTML = originalContent;
      }
    }

    async function printPDF() {
      const content = document.getElementById('laporan-content');
      const preview = document.getElementById('laporan-preview');
      if (preview.classList.contains('hidden')) {
        showToast('Silakan generate laporan terlebih dahulu', 'error');
        return;
      }

      const btnPrint = document.getElementById('btn-print-pdf');
      const originalContent = btnPrint.innerHTML;
      btnPrint.disabled = true;
      btnPrint.innerHTML = '<div class="loading-spinner mx-auto"></div>';

      try {
        if (typeof html2canvas === 'undefined') throw new Error('Library html2canvas belum dimuat');
        if (typeof window.jspdf === 'undefined') throw new Error('Library jsPDF belum dimuat');

        await new Promise(r => setTimeout(r, 800));

        const canvas = await html2canvas(content, {
          scale: 3,
          useCORS: true,
          backgroundColor: '#ffffff',
          logging: false
        });

        const imgData = canvas.toDataURL('image/png', 1.0);
        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF('p', 'mm', 'a4');

        const pdfWidth = pdf.internal.pageSize.getWidth();
        const pdfHeight = pdf.internal.pageSize.getHeight();
        const margin = 10;
        const imgWidth = pdfWidth - margin * 2;
        const imgHeight = (canvas.height * imgWidth) / canvas.width;

        let heightLeft = imgHeight;
        let position = margin;
        let pageCount = 0;

        pdf.addImage(imgData, 'PNG', margin, position, imgWidth, imgHeight, undefined, 'FAST');
        heightLeft -= (pdfHeight - margin * 2);
        pageCount++;

        while (heightLeft > 0) {
          position = -(pageCount * (pdfHeight - margin * 2)) + margin;
          pdf.addPage();
          pdf.addImage(imgData, 'PNG', margin, position, imgWidth, imgHeight, undefined, 'FAST');
          heightLeft -= (pdfHeight - margin * 2);
          pageCount++;
        }

        const jenis = document.getElementById('jenis-laporan').value;
        const bulan = document.getElementById('bulan-laporan').value;
        const tahun = document.getElementById('tahun-laporan').value;
        const namaBulan = ['', 'Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];

        const filename = jenis === 'bulanan'
          ? `Laporan_Agenda_${namaBulan[parseInt(bulan,10)]}_${tahun}.pdf`
          : `Laporan_Agenda_${tahun}.pdf`;

        pdf.save(filename);
        showToast('✅ PDF berhasil diunduh', 'success');
      } catch (error) {
        console.error(error);
        showToast('❌ Gagal membuat PDF: ' + error.message, 'error');
      } finally {
        btnPrint.disabled = false;
        btnPrint.innerHTML = originalContent;
      }
    }

    // Helpers
    function getStatusLabel(status) {
      const labels = { terjadwal:'Terjadwal', berlangsung:'Berlangsung', selesai:'Selesai' };
      return labels[status] || status;
    }

    function formatTanggal(tanggal) {
      const date = new Date(tanggal);
      const options = { weekday:'long', year:'numeric', month:'long', day:'numeric' };
      return date.toLocaleDateString('id-ID', options);
    }

    function formatTanggalSingkat(tanggal) {
      const date = new Date(tanggal);
      return date.toLocaleDateString('id-ID', { year:'numeric', month:'short', day:'numeric' });
    }

    function showToast(message, type) {
      const existingToast = document.querySelector('.toast');
      if (existingToast) existingToast.remove();
      const toast = document.createElement('div');
      toast.className = `toast toast-${type}`;
      toast.textContent = message;
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 3000);
    }

    function escapeHtml(str) {
      return String(str ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'<','>':'>','"':'"',"'":'&#039;'}[m]));
    }

    // Event listeners
    document.getElementById('btn-admin-toggle').addEventListener('click', toggleAdminAccess);
    document.getElementById('btn-tambah-agenda').addEventListener('click', openFormModal);
    document.getElementById('btn-laporan').addEventListener('click', openLaporanModal);
    document.getElementById('filter-status').addEventListener('change', renderAgendas);
    document.getElementById('filter-tanggal').addEventListener('change', renderAgendas);

    document.getElementById('form-login').addEventListener('submit', async (e) => {
      e.preventDefault();
      const password = document.getElementById('input-password').value;
      await doLogin(password);
    });

    // Initialize
    updateAdminUI();
    initializeApp();
  </script>
</body>
</html>
